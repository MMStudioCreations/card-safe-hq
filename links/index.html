<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Safe HQ</title>
<meta name="description" content="Shop the Card Safe HQ eBay store, catch live breaks on Whatnot, or follow along on Instagram.">
<meta property="og:title" content="Card Safe HQ">
<meta property="og:description" content="Shop the eBay store, catch live breaks on Whatnot, or follow along on Instagram.">
<meta property="og:url" content="https://cardsafehq.com">
<meta property="og:site_name" content="Card Safe HQ">
<link rel="canonical" href="https://cardsafehq.com">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0B0F14;
    --ink-raised: #11161D;
    --line: #1D242E;
    --gold: #C9A34E;
    --gold-bright: #E8C877;
    --text: #EDEAE2;
    --text-dim: #8B929C;
    --holo-1: #7FDBCA;
    --holo-2: #C9A34E;
    --holo-3: #B98BD4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--ink);
    color: var(--text);
    font-family: 'Sora', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 40px;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ---------- Mark ---------- */
  .mark {
    width: 100%;
    max-width: 360px;
    margin-bottom: 20px;
  }
  .mark img {
    width: 100%;
    height: auto;
    display: block;
    filter: drop-shadow(0 8px 20px rgba(0,0,0,0.5));
  }

  .tag {
    margin-top: 8px;
    font-size: 12.5px;
    font-weight: 300;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-dim);
    text-align: center;
  }

  .rule {
    width: 42px;
    height: 1px;
    background: var(--gold);
    opacity: 0.6;
    margin: 26px 0;
  }

  /* ---------- Links ---------- */
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
    list-style: none;
  }

  .card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    min-height: 64px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--ink-raised);
    color: var(--text);
    text-decoration: none;
    transition: border-color 160ms ease, transform 160ms ease;
  }
  .card:active { transform: scale(0.985); }
  @media (hover: hover) {
    .card:hover { border-color: var(--gold); }
  }

  .card .label { flex: 1; }
  .card .label strong {
    display: block;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .card .label small {
    display: block;
    margin-top: 3px;
    font-size: 12px;
    font-weight: 300;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }
  .card .arrow {
    color: var(--gold);
    font-size: 18px;
    line-height: 1;
  }
  .card .icon {
    width: 22px;
    text-align: center;
    color: var(--gold);
    flex-shrink: 0;
  }
  .card .icon svg { display: block; width: 20px; height: 20px; }

  /* ---------- Signature: holo foil on the primary card ---------- */
  .card.primary {
    position: relative;
    border: 1px solid transparent;
    background:
      linear-gradient(var(--ink-raised), var(--ink-raised)) padding-box,
      linear-gradient(120deg, var(--holo-1), var(--holo-2) 45%, var(--holo-3) 80%, var(--holo-1)) border-box;
    background-size: 100% 100%, 300% 300%;
    animation: foil 7s linear infinite;
    overflow: hidden;
  }
  .card.primary::before {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    width: 60px;
    left: -80px;
    background: linear-gradient(100deg, transparent, rgba(232,200,119,0.14), transparent);
    animation: sheen 5.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes foil {
    0%   { background-position: 0 0, 0% 50%; }
    100% { background-position: 0 0, 300% 50%; }
  }
  @keyframes sheen {
    0%, 55%  { left: -80px; }
    85%, 100% { left: 120%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card.primary { animation: none; }
    .card.primary::before { display: none; }
  }

  .card:focus-visible {
    outline: 2px solid var(--gold-bright);
    outline-offset: 3px;
  }

  /* ---------- Footer ---------- */
  footer {
    margin-top: 40px;
    text-align: center;
  }
  footer .show {
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 300;
  }
  footer .fine {
    margin-top: 10px;
    font-size: 11px;
    font-weight: 300;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<div class="page">

  <div class="mark"><img src="/logo.png" alt="Card Safe HQ" width="1568" height="523"></div>
  <p class="tag">Graded singles · Sealed · Restoration</p>
  <div class="rule"></div>

  <ul class="links" id="links"></ul>

  <footer>
    <p class="show" id="show-line"></p>
    <p class="fine">cardsafehq.com</p>
  </footer>
</div>

<script>
/* ============================================================
   CONFIG — the only block you need to edit.
   ============================================================ */
const CONFIG = {
  // Shown under the links.
  showLine: "Graded singles, sealed product & live breaks",

  // Appended to every outbound URL for attribution (set to "" to disable).
  tracking: "utm_source=cardsafehq.com",

  links: [
    {
      primary: true,
      icon: "cart",
      title: "Shop the eBay Store",
      subtitle: "Graded slabs, raw singles & sealed product",
      url: "https://www.ebay.com/str/cardsafehq"
    },
    {
      icon: "live",
      title: "Watch on Whatnot",
      subtitle: "Live breaks & auctions",
      url: "https://www.whatnot.com/user/cardsafehq"
    },
    {
      icon: "camera",
      title: "Follow on Instagram",
      subtitle: "@cardsafe.hq — pickups, breaks & restorations",
      url: "https://www.instagram.com/cardsafe.hq"
    },
    {
      icon: "tiktok",
      title: "Follow on TikTok",
      subtitle: "@cardsafe.hq — pickups, breaks & restorations",
      url: "https://www.tiktok.com/@cardsafe.hq"
    },
    {
      icon: "article",
      title: "Read on Staten News",
      subtitle: "TCG market coverage & articles",
      url: "https://statennews.com"
    }
  ]
};
/* ============================================================ */

const ICONS = {
  cart:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1.4"/><circle cx="19" cy="21" r="1.4"/><path d="M2 3h3l2.6 12.6a1.5 1.5 0 0 0 1.5 1.2h9.5a1.5 1.5 0 0 0 1.5-1.2L22 7H6"/></svg>',
  wrench: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4.5 4.5 0 0 0-6 6L3 18l3 3 5.7-5.7a4.5 4.5 0 0 0 6-6L14 13l-3-3 3.7-3.7z"/></svg>',
  camera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="0.6" fill="currentColor"/></svg>',
  live:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M6.5 6.5a8 8 0 0 0 0 11M17.5 6.5a8 8 0 0 1 0 11M3.5 3.5a12.5 12.5 0 0 0 0 17M20.5 3.5a12.5 12.5 0 0 1 0 17"/></svg>',
  tiktok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3v11.6a4 4 0 1 1-4-4c.35 0 .68.05 1 .14"/><path d="M15 3c.5 2.3 2.3 4 4.7 4.2"/></svg>',
  article: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h13a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V3z"/><path d="M2 7v12a2 2 0 0 0 2 2h2"/><path d="M9.5 8h7M9.5 12h7M9.5 16h4"/></svg>'
};

function withTracking(url) {
  if (!CONFIG.tracking || url.startsWith("mailto:")) return url;
  return url + (url.includes("?") ? "&" : "?") + CONFIG.tracking;
}

document.getElementById("show-line").textContent = CONFIG.showLine;

document.getElementById("links").innerHTML = CONFIG.links.map(l => {
  const inner = `
      <span class="icon">${ICONS[l.icon] || ""}</span>
      <span class="label">
        <strong>${l.title}</strong>
        <small>${l.subtitle}</small>
      </span>`;
  return `<li>
    <a class="card${l.primary ? " primary" : ""}" href="${withTracking(l.url)}" ${l.url.startsWith("mailto:") ? "" : 'target="_blank" rel="noopener"'}>${inner}<span class="arrow">→</span>
    </a>
  </li>`;
}).join("");
</script>
</body>
</html>
